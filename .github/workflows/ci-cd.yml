name: Smart Crawler CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  # 也可以設定定時排程（例如每天台灣時間早上 8 點執行一次）
  schedule:
    - cron: '0 0 * * *'

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: 取得程式碼
      uses: actions/checkout@v4

    - name: 設定 Python 環境
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: 安裝相依套件
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest playwright
        playwright install

    - name: 執行 Pytest 離線單元測試
      run: |
        pytest